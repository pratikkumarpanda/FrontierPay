<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FrontierPay — Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect trick.
    // When GitHub Pages 404s on a deep link (e.g. /FrontierPay/dashboard),
    // it serves this file. We save the intended path and redirect to the
    // app root. The root layout script then restores the path so Next.js
    // client-side router renders the correct page.
    sessionStorage.setItem('ghpages_redirect', location.pathname + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="0;URL='/FrontierPay/'">
</head>
<body></body>
</html>
